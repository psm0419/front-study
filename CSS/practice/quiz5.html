<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            margin: 0 auto;
            width: 800px;
            border: 1px solid black;
            margin-top: 50px;
        }
        .top {
            display: flex;
        }
        .top1 {
            border: 1px solid black;
            background-color: yellow;
            width: 50%;
            height: 100px;
        }
        .top2 {
            border: 1px solid black;
            background-color: gray;
            width: 50%;
            height: 100px;
        }
        .purple {
            border: 1px solid black;
            background-color: purple;
            width: 100%;
            height: 100px;
        }
        .mid {
            border: 1px solid black;
            position: relative;
        }
        .mid::after {
            content: "";
            display: block;
            clear: both;
        }
        .mid-left {
            border: 1px solid black;
            background-color: cornflowerblue;
            width: 40%;
            height: 200px;
            float: left;
        }
        .mid-right1 {
            border: 1px solid black;
            background-color: yellow;
            width: 60%;
            height: 100px;
            float: left;
        }
        .mid-right2 {
            border: 1px solid black;
            background-color: coral;
            width: 60%;
            height: 100px;
            float: left;
        }
        .bottom {
            display: flex;
        }
        .bot-1 {
            border: 1px solid black;
            background-color: yellow;
            width: 25%;
            height: 100px;
        }
        .bot-2 {
            border: 1px solid black;
            background-color: orange;
            width: 25%;
            height: 100px;
        }
        .bot-3 {
            border: 1px solid black;
            background-color: yellow;
            width: 25%;
            height: 100px;
        }
        .bot-4 {
            border: 1px solid black;
            background-color: greenyellow;
            width: 25%;
            height: 100px;
        }
        @media screen and (max-width:700px) {
            .container {
                width: 100%;
            }
        }
        @media screen and (max-width:650px) {
            .bottom {
                flex-wrap: wrap;
            }
            .bot-1, .bot-2, .bot-3, .bot-4{
                width: 50%;
            }
        }
        @media screen and (max-width:500px) {
            .top {
                flex-wrap: wrap;  /* 플렉스디렉션을 콜롬으로 바꿔도 세로배치됨 */
            }
            .top1, .top2 {
                width: 100%;
            }
            .mid-left {
                width: 100%;
                height: 100px;
            }
            .mid-right1, .mid-right2 {
                width: 50%;
            }
        }
        @media screen and (max-width:350px) {
            .mid-right1, .mid-right2 {
                width: 100%;
            }
            .bot-1, .bot-2, .bot-3, .bot-4{
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="top">
            <div class="top1"></div>
            <div class="top2"></div>
        </div>
        <div class="purple"></div>
        <div class="mid">
            <div class="mid-left"></div>
            <div class="mid-right1"></div>
            <div class="mid-right2"></div>
        </div>
        <div class="bottom">
            <div class="bot-1"></div>
            <div class="bot-2"></div>
            <div class="bot-3"></div>
            <div class="bot-4"></div>
        </div>
    </div>
</body>

</html>
