<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box {
            position: relative;
            width: 100px;
            height: 100px;
            background-color: blue;
            margin: 20px;
            animation-name: ani;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-direction: alternate;

            /*  margin-left
                position +left
                transftorm: translate            
            */
            
        }
        @keyframes ani {
            0% {
                background-color: blue;
                transform: rotate(0deg); /* transform은 따로쓰면 덮어짐 옆에 적으면 됨 */
                left: 0px;
            }
            50% {
                background-color: orange;
                transform: rotate(180deg);
                left: 150px;
            }
            100% {
                background-color: pink;
                transform: rotate(360deg);
                left: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
