<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            
            border: 1px solid black;
            width: 700px;
            margin: 50px auto;
            margin-top: 50px;

        }
        .top-box {
            height: 100px;
            display: flex;
            justify-content: space-between;
        }
        .tb-1 {
            display: flex;
            width: 200px;
            height: 100px;
            background-color: red;
            justify-content: center;
            align-items: center;
        }
        .tb-2 {
            display: flex;
            width: 100px;
            height: 100px;
            background-color: red;
            justify-content: center;
            align-items: center;
        }
        .mid-box { 
            display: flex;
            height: 300px;
        }
        .mb-1 {
            display: flex;
            background-color: orange;
            width: 490px;
            height: 300px;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
        }
        .black-box {
            display: flex;
            width: 100px;
            height: 50px;
            background-color: black;
            margin: 30px;
            transition-property: all;
            transition-duration: 1s;
            
        }
        .black-box:hover {
            transform: scale(1.3, 1.3);
        }
        .mb-2 {
            display: flex;
            width: 210px;
            height: 300px;
            background-color: green;
            justify-content: center;
            align-items: center;
        }
        .bot-box {
            display: flex;
            height: 100px;
            background-color: blue;
            justify-content: center;
            align-items: center;
            
        }
        p {
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-box">
            <div class="tb-1"><p>메인메뉴</p></div>
            <div class="tb-2"><p>마이페이지</p></div>
        </div>
        <div class="mid-box">
            <div class="mb-1">
                <div class="black-box"></div>
                <div class="black-box"></div>
                <div class="black-box"></div>
                <div class="black-box"></div>
                <div class="black-box"></div>
                <div class="black-box"></div>
            </div>
            <div class="mb-2"><p>aside</p></div>
        </div>
        <div class="bot-box"><p>footer</p></div>
        
    </div>
</body>
</html>
