<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .item {
            width: 100px;
            height: 100px;
            border: 1px solid black;
            margin: 10px;
            display: flex;
            justify-content: center; /* 가로축(row가 주축일때) */
            align-items: center; /* 세로축 */
        }
        .container {
            height: 400px;
            background-color: lightblue;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            /* flex-flow: row wrap; */
            justify-content: space-between; /* 비트윈은 2개면 양쪽정렬 효과 */
            align-items: center; /* 두줄로 보고 각 줄에서 중앙 */
            align-content: center; /* 한줄로 보고 전체에서 중앙 */

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>

    </div>
    
</body>
</html>
