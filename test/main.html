<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            margin: 0 auto;
            width: 500px;
            height: 530px;
            background-color: darkslategray;
            margin-top: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            
            transition-property: all;
            transition-duration: 3s;
            
        }
        .welcome {
            display:none;
            transition-property: all;
            transition-duration: 3s;
            
        }
        .container:hover .welcome {
            display: flex;
            width: 350px;
            height: 50px;
            background-color:seagreen;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="welcome">
            <p>Welcome to Webpage!</p>
        </div>
    </div>
</body>
</html>
