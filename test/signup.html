<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            margin: 0 auto;
            width: 500px;
            height: 530px;
            background-color: darkslategray;
            
        }
        .header {
            display: flex;
            width: 400px;
            background-color: gray;
            margin: 50px;
            
        }
        .sign-up {
            display: flex;
            width: 50%;
            height: 50px;
            background-color: seagreen;
            justify-content: center;
            align-items: center;
        }
        .header a {
            display: flex;
            width: 50%;
            height: 50px;            
            justify-content: center;
            align-items: center;
            text-decoration: none;
        }
        .text {
            color: white;
            text-align: center;
        }
        
        #email {            
            width: 400px;
            height: 30px;
            border: 1px solid white;    
            margin: 50px;      
            background-color: darkslategray;  
            margin-bottom: 10px;
        }
        #password {            
            width: 400px;
            height: 30px;
            border: 1px solid white;      
            margin: 50px;      
            background-color: darkslategray;
            margin-bottom: 10px;
        }
        #password2 {
            width: 400px;
            height: 30px;
            border: 1px solid white;      
            margin: 50px;      
            background-color: darkslategray;
            margin-bottom: 10px;
        }
        .move {
            display: flex;
            width: 400px;
            height: 50px;
            background-color: seagreen;
            margin: 50px;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="sign-up"><p>Sign Up</p></div>
            <a href="./login.html">Log In</a>
        </div>
        <div class="text">
            <p style="font-size: 20px;">Sign Up For Free</p>
        </div>
    
        <input type="email" id="email" placeholder="Email Address *"></input>
        <input type="password" id="password" placeholder="Set A Password *"></input>
        <input type="password" id="password2" placeholder="Confirm A Password *"></input>
        
        <div class="footer">
            <div class="move"><p style="font-size: 20px;">GET STARTED</p></div>
        </div>
    </div>
</body>
</html>
