<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            border: 1px solid black;
        }
        .bg-red {
            background-color: red;
        }
    </style>
</head>
<body>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    
    

    <script>
        //개별적으로 선택해서 적용
        const box1 = document.getElementById('box1');
        const box2 = document.getElementById('box2');
        const box3 = document.getElementById('box3');
        /*
        box1.addEventListener('click', ()=>{
            box1.classList.toggle('bg-red');
        });
        box2.addEventListener('click', ()=>{
            box2.classList.toggle('bg-red');
        });
        box3.addEventListener('click', ()=>{
            box3.classList.toggle('bg-red');
        });
        */
        //동시에 선택하는 방법들
        const boxArr = document.querySelectorAll('.box');
        //boxArr[box1, box2, box3]

        //for문으로 배열에 인덱스별로 적용
        /*
        for(let i =0; i<boxArr.length; i++){
            //boxArr[i].onclick = ()=> {boxArr[i].classList.toggle('bg-red');}
            boxArr[i].addEventListener('click', ()=>{
                boxArr[i].classList.toggle('bg-red');
            });
        }
        */
        //선택된 아이템에게 적용
        /*
        boxArr.forEach((item)=>{
            item.addEventListener('click', ()=>{
                item.classList.toggle('bg-red');
            })
        });
        */
        //function에서 this키워드 활용
        /*
        boxArr.forEach((item)=>{
            item.addEventListener('click', function(){
                console.log(this);
                this.classList.toggle('bg-red'); 
                //this로 이벤트발생시킨 당사자한테 기능을 걸어줌
            })
        });
        */
        // 화살표 함수인 경우는 이벤트 객체의 target속성 필요
        boxArr.forEach((item)=>{
            item.addEventListener('click', (event)=>{
                console.log(event);
                event.target.classList.toggle('bg-red'); 
                //이벤트가 발생한 box요소 선택
                })
        });
    </script>
</body>
</html>
