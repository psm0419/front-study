<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>달식당</span> <span id = 'like'>좋아요♡</span><span id="count">0</span>




    <script>
        let count = 0;
        const countDisplay = document.getElementById('count');
        document.getElementById('like').addEventListener('click', ()=>{
        count++;
        countDisplay.textContent = count;  // 카운트 업데이트
        });
        
    </script>
</body>
</html>
